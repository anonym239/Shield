name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  list-urls:
    name: Blocklist URLs reachable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-lists.sh
  go-core:
    name: Go core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gocore/go.mod
          cache-dependency-path: gocore/go.sum
      - name: go vet + test
        working-directory: gocore
        run: |
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go vet ./shieldcore
          go test ./...

  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: gocore/go.mod
          cache-dependency-path: gocore/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build Go core (gomobile)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-gocore.sh
      - name: assembleDebug test lint
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shield-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Windows installer smoke build (NSIS)
        run: |
          (cd desktop && go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --out cmd/shield/rsrc --arch amd64 \
            && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-H=windowsgui -s -w" -o ../installer/Shield.exe ./cmd/shield \
            && cp winres/shield.ico ../installer/shield.ico)
          curl -sSLo /tmp/wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  /tmp/wintun.zip" | sha256sum -c -
          unzip -q -o /tmp/wintun.zip -d /tmp/ && cp /tmp/wintun/bin/amd64/wintun.dll installer/wintun.dll
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis > /dev/null
          curl -sSLo /tmp/pt.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          unzip -q /tmp/pt.zip -d installer/
          cp app/build/outputs/apk/debug/app-universal-debug.apk installer/Shield.apk
          mkdir -p dist
          makensis -V2 -DVERSION=0.0.0 -DOUTFILE="../dist/Shield-Setup-ci.exe" installer/shield-setup.nsi
          ls -la dist/
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  e2e:
    name: End-to-end tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: gocore/go.mod
          cache-dependency-path: gocore/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build Go core (gomobile)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-gocore.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests (DAO + VPN end-to-end)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --stacktrace connectedDebugAndroidTest
      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: app/build/reports/androidTests/

  style:
    name: ktlint + detekt (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: ktlint
        run: |
          curl -sSLo ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint && chmod +x ktlint
          ./ktlint "app/src/**/*.kt" --reporter=plain || true
      - name: detekt
        run: |
          curl -sSLo detekt.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          java -jar detekt.jar --input app/src/main/java --config config/detekt.yml --build-upon-default-config || true
