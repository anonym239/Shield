name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-core:
    name: Go core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gocore/go.mod
          cache-dependency-path: gocore/go.sum
      - name: go vet + test
        working-directory: gocore
        run: |
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go vet ./shieldcore
          go test ./...

  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: gocore/go.mod
          cache-dependency-path: gocore/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build Go core (gomobile)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-gocore.sh
      - name: assembleDebug test lint
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shield-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  style:
    name: ktlint + detekt (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: ktlint
        run: |
          curl -sSLo ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint && chmod +x ktlint
          ./ktlint "app/src/**/*.kt" --reporter=plain || true
      - name: detekt
        run: |
          curl -sSLo detekt.jar https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          java -jar detekt.jar --input app/src/main/java --config config/detekt.yml --build-upon-default-config || true
