name: Release

on:
  push:
    tags: ['v*']
    # Release by changing the VERSION file (no tag push needed)
    paths: ['VERSION']
    branches: ['**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne "v", z. B. 1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V="$(tr -d '[:space:]' < VERSION)"; fi
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: gocore/go.mod
          cache-dependency-path: gocore/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build Go core (gomobile)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-gocore.sh
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SHIELD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHIELD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIELD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIELD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SHIELD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "SHIELD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SHIELD_KEY_ALIAS=$KEY_ALIAS"
              echo "SHIELD_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Signiert mit dem Release-Schlüssel des Projekts." >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Release-Schlüssel hinterlegt (Secret SHIELD_KEYSTORE_B64). Es wird ein einmaliger Schlüssel erzeugt – Updates über spätere Releases müssen dann neu installiert werden."
            PW=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias shield -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Shield, O=Shield Open Source, C=DE" > /dev/null
            {
              echo "SHIELD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "SHIELD_KEYSTORE_PASSWORD=$PW"
              echo "SHIELD_KEY_ALIAS=shield"
              echo "SHIELD_KEY_PASSWORD=$PW"
            } >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Hinweis: Dieses Release ist mit einem einmaligen Schlüssel signiert (kein Projekt-Schlüssel hinterlegt)." >> "$GITHUB_ENV"
          fi
      - name: Test + build release APK
        env:
          SHIELD_VERSION_NAME: ${{ steps.v.outputs.version }}
          SHIELD_VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          ./gradlew --stacktrace testDebugUnitTest assembleRelease
          mkdir -p dist
          V="${{ steps.v.outputs.version }}"
          ls app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/Shield-$V.apk"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/Shield-$V-arm64.apk"
          for a in dist/*.apk; do echo "== $a"; "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify -v "$a" | grep -E "Verifies|scheme \(|DOES NOT" ; done
      - name: Build Windows installer (NSIS)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis > /dev/null
          curl -sSLo /tmp/pt.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          unzip -q /tmp/pt.zip -d installer/
          cp "dist/Shield-${{ steps.v.outputs.version }}.apk" installer/Shield.apk
          makensis -V2 -DVERSION="${{ steps.v.outputs.version }}" -DOUTFILE="../dist/Shield-Setup-${{ steps.v.outputs.version }}.exe" installer/shield-setup.nsi
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          V="${{ steps.v.outputs.version }}"
          {
            echo "## Shield $V"
            echo
            sed -n "/^## \[$V\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d'
            echo
            echo "### Downloads"
            echo "- **Shield-$V-arm64.apk** – empfohlen für fast alle Handys (ARM64, z. B. Samsung Galaxy, Pixel). Auf dem Handy öffnen und installieren."
            echo "- **Shield-$V.apk** – Universal-APK für alle Prozessoren (größer)."
            echo "- **Shield-Setup-$V.exe** – Windows-Installer: installiert die APK per USB (ADB) auf ein angeschlossenes Android-Handy."
            echo "- **SHA256SUMS.txt** – Prüfsummen"
            echo
            echo "$SIGNING_NOTE"
          } > dist/NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Shield ${{ steps.v.outputs.version }}
          body_path: dist/NOTES.md
          target_commitish: ${{ github.sha }}
          files: |
            dist/Shield-${{ steps.v.outputs.version }}.apk
            dist/Shield-${{ steps.v.outputs.version }}-arm64.apk
            dist/Shield-Setup-${{ steps.v.outputs.version }}.exe
            dist/SHA256SUMS.txt
